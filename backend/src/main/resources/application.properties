spring.application.name=redtextil-api

# La app Android llama a http://10.0.2.2:8080/api/ desde el emulador
server.port=8080
server.servlet.context-path=/api

# Base de datos H2 guardada en archivo (backend/data/redtextil.mv.db): los datos sobreviven a los reinicios
spring.datasource.url=jdbc:h2:file:./data/redtextil;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web para revisar las tablas: http://localhost:8080/api/h2-console (JDBC URL de arriba, usuario sa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fotos del catalogo (la app ya las manda comprimidas)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.fotos-dir=./data/fotos
